<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Unknown Protocol</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #00aaff;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .terminal {
      width: 90%;
      max-width: 650px;
      padding: 35px 25px;
      border: 1px solid #0066ff;
      box-shadow:
        0 0 15px #0066ff,
        inset 0 0 20px rgba(0, 100, 255, 0.08);
      background: #02050a;
    }

    .top {
      color: #777;
      font-size: 12px;
      margin-bottom: 35px;
    }

    .warning {
      color: #008cff;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    h1 {
      color: #00aaff;
      text-align: center;
      font-size: clamp(28px, 8vw, 50px);
      letter-spacing: 5px;
      text-shadow: 0 0 10px #008cff;
      margin: 20px 0;
    }

    .line {
      height: 1px;
      background: #0066ff;
      box-shadow: 0 0 8px #0066ff;
      margin: 25px 0;
    }

    .status {
      color: #aaa;
      line-height: 1.8;
      font-size: 14px;
    }

    .status span {
      color: #00aaff;
    }

    button {
      display: block;
      margin: 35px auto 0;
      padding: 13px 30px;
      background: transparent;
      border: 1px solid #008cff;
      color: #00aaff;
      font-family: monospace;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 140, 255, 0.4);
      transition: 0.2s;
    }

    button:hover {
      background: #008cff;
      color: #000;
      box-shadow: 0 0 25px #008cff;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background: #00aaff;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      color: #333;
      font-size: 10px;
    }
  </style>
</head>

<body>

  <div class="terminal">

    <div class="top">
      UNKNOWN_PROTOCOL // SECURE TERMINAL
    </div>

    <div class="warning">
      ⚠ RESTRICTED SYSTEM ⚠
    </div>

    <h1>UNKNOWN<br>PROTOCOL</h1>

    <div class="line"></div>

    <div class="status">
      &gt; Initializing system... <span>OK</span><br>
      &gt; Establishing secure connection... <span>OK</span><br>
      &gt; Identity verification... <span>REQUIRED</span><br>
      &gt; Awaiting authorization <span class="cursor"></span>
    </div>

    <button onclick="startProtocol()">
      [ ENTER SYSTEM ]
    </button>

    <div class="footer">
      CONNECTION: ENCRYPTED
    </div>

  </div>

  <script>
    function startProtocol() {
      alert("ACCESS MODULE NOT AVAILABLE YET...");
    }
  </script>

</body>
  </html>
